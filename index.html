<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Rack Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(ellipse at 50% 30%, #fdd47a 0%, #f4c255 55%, #e8a820 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 56px 24px;
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 28px;
            text-align: center;
        }

        .logo {
            width: 143px;
            height: 143px;
            object-fit: contain;
            margin-bottom: 2px;
        }

        .company-name {
            background-color: #000;
            color: #fff;
            padding: 13px 32px;
            border-radius: 50px;
            font-size: 1.65rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            margin-bottom: 14px;
        }

        .tagline {
            font-size: 0.95rem;
            color: #1a1a1a;
            font-weight: 400;
            opacity: 0.75;
            letter-spacing: 0.03em;
        }

        .divider {
            width: 48px;
            height: 3px;
            background: #000;
            opacity: 0.15;
            border-radius: 2px;
            margin: 20px 0;
        }

        .founders {
            display: flex;
            gap: 28px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .founder-card {
            background: #fff;
            border-radius: 20px;
            padding: 36px 32px 28px;
            width: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
        }

        .photo-ring {
            width: 136px;
            height: 136px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #f4c255, #e8a820);
            margin-bottom: 18px;
            flex-shrink: 0;
        }

        .founder-photo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            object-position: center top;
            display: block;
        }

        .founder-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: #000;
            margin-bottom: 6px;
        }

        .founder-title {
            font-size: 0.72rem;
            font-weight: 600;
            line-height: 1.3;
            color: #fff;
            background: #000;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 4px 12px;
            border-radius: 50px;
            margin-bottom: 20px;
        }

        .linkedin-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-top: auto;
            background-color: #0077b5;
            color: #fff;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 50px;
            transition: background-color 0.2s, transform 0.15s;
        }

        .linkedin-btn:hover {
            background-color: #005983;
            transform: translateY(-1px);
        }

        .linkedin-btn svg {
            flex-shrink: 0;
        }

        @media (max-width: 520px) {
            .founders {
                flex-direction: column;
                align-items: center;
            }

            .founder-card {
                width: 100%;
                max-width: 280px;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <img src="img/LogoWebP.webp" alt="Brain Rack Games logo" class="logo">
        <h1 class="company-name">Brain Rack Games</h1>
        <p class="tagline">We make multiplayer sim-strategy games</p>
    </header>

    <div class="divider"></div>

    <section class="founders">

        <div class="founder-card">
            <div class="photo-ring">
                <img src="img/CallumImage.jpg" alt="Callum Lawson" class="founder-photo">
            </div>
            <p class="founder-name">Callum Lawson</p>
            <p class="founder-title" style="font-size: 1.15rem; line-height: 1.872rem">CEO</p>
            <a class="linkedin-btn" href="https://www.linkedin.com/in/callum-a-f-lawson/" target="_blank" rel="noopener">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M20.447 20.452H17.01v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.588V9h3.301v1.561h.046c.46-.869 1.584-1.785 3.26-1.785 3.487 0 4.131 2.296 4.131 5.284v6.392zM5.337 7.433a1.924 1.924 0 1 1 0-3.848 1.924 1.924 0 0 1 0 3.848zm1.678 13.019H3.659V9h3.356v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                </svg>
                LinkedIn
            </a>
        </div>

        <div class="founder-card">
            <div class="photo-ring">
                <img src="img/AdamImage.jpg" alt="Adam Toward" class="founder-photo">
            </div>
            <p class="founder-name">Adam Toward</p>
            <p class="founder-title" style="font-size: 1.15rem; line-height: 1.872rem">CTO</p>
            <a class="linkedin-btn" href="https://www.linkedin.com/in/adam-toward-a1a23283/" target="_blank" rel="noopener">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M20.447 20.452H17.01v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.588V9h3.301v1.561h.046c.46-.869 1.584-1.785 3.26-1.785 3.487 0 4.131 2.296 4.131 5.284v6.392zM5.337 7.433a1.924 1.924 0 1 1 0-3.848 1.924 1.924 0 0 1 0 3.848zm1.678 13.019H3.659V9h3.356v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                </svg>
                LinkedIn
            </a>
        </div>

        <div class="founder-card">
            <div class="photo-ring">
                <img src="img/PatrickImage.jpg" alt="Patrick Hansell" class="founder-photo">
            </div>
            <p class="founder-name">Patrick Hansell</p>
            <p class="founder-title">Director of Engineering</p>
            <a class="linkedin-btn" href="https://www.linkedin.com/in/patrick-hansell/" target="_blank" rel="noopener">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M20.447 20.452H17.01v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.588V9h3.301v1.561h.046c.46-.869 1.584-1.785 3.26-1.785 3.487 0 4.131 2.296 4.131 5.284v6.392zM5.337 7.433a1.924 1.924 0 1 1 0-3.848 1.924 1.924 0 0 1 0 3.848zm1.678 13.019H3.659V9h3.356v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                </svg>
                LinkedIn
            </a>
        </div>

    </section>

</body>
</html>
